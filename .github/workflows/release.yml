name: Publish mod release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mod-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate authored content
        run: |
          python3 -B tools/validate_gen2_balance.py
          python3 -B tools/validate_gen2_quests.py
      - name: Build installable ZIP
        run: python3 -B tools/build_release.py --output "$RUNNER_TEMP/mod-release"
      - name: Publish new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          ID=$(python3 -c 'import json; print(json.load(open("manifest.json"))["id"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump manifest.json version for the next update."
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/mod-release/$ID-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "Kanto National Dex $VERSION" --generate-notes
